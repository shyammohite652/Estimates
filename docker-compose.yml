# SQL Server for local development. The API and UI run on the host (see README).
#   docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: construction-estimator-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Development-only password; must match ConnectionStrings:Default in appsettings.Development.json
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Estimator_Dev_P@ssw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqldata:
